  <style>
:root {
  /* Paper — warm beige, the identity of the deck */
  --bg: #F4F0E7;
  --bg-2: #FBF8F1;
  --surface: #FFFFFF;
  --ink: #1B1A16;
  --ink-2: #666154;
  --ink-3: #6F6759;
  --line: #DBD3C2;
  --line-strong: #B9B09C;

  /* Google accents — used as small signals, never as fields */
  --blue: #4285F4;
  --red: #EA4335;
  --yellow: #FBBC05;
  --green: #34A853;

  /* Shape — sharp by default; pills only where something is interactive */
  --radius: 0;
  --radius-sm: 0;
  --radius-pill: 999px;

  /* Type */
  --font-display: "Google Sans Flex", "Google Sans", "Product Sans", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "Google Sans Code", "JetBrains Mono", ui-monospace, monospace;

  /* Motion */
  --ease: cubic-bezier(.2, .7, .2, 1);
  --shadow: none;
  --shadow-lift: none;

  /* Layout */
  --pad-x: 112px;
  --pad-y: 80px;

  /* Retained for the SVG diagrams */
  --gemini: linear-gradient(102deg, #4285F4 0%, #7C86D9 30%, #D97C86 60%, #FBBC05 88%);
  --gemini-soft: linear-gradient(102deg, #4285F4 0%, #D97C86 55%, #FBBC05 100%);
}

</style>
  <style>
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
h1, h2, h3, h4, p, ul, ol, figure, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
a { color: inherit; }
::selection { background: var(--ink); color: var(--bg); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>

  <style>
#viewport {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: #E7E0D0;
}

#stage {
  width: 1920px;
  height: 1080px;
  position: relative;
  flex: none;
  transform-origin: center center;
  background: var(--bg);
  overflow: hidden;
  box-shadow: none;
}

.slide {
  position: absolute;
  inset: 0;
  padding: var(--pad-y) var(--pad-x) 96px;
  display: flex;
  flex-direction: column;
  gap: 32px;
  opacity: 0;
  visibility: hidden;
  transform: translateX(28px);
  transition: opacity .45s var(--ease), transform .45s var(--ease), visibility 0s .45s;
  background: var(--bg);
}
.slide.is-active {
  opacity: 1;
  visibility: visible;
  transform: none;
  transition-delay: 0s;
}
.slide.is-past { transform: translateX(-28px); }

.slide-head {
  display: flex;
  flex-direction: column;
  gap: 18px;
  max-width: 1500px;
  flex: none;
}
.slide-head.head-row {
  flex-direction: row;
  justify-content: space-between;
  align-items: flex-end;
  max-width: none;
  gap: 48px;
}
.slide-head.head-row > div:first-child {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ---------------------------------------------------------------- chrome */

#progress {
  position: absolute;
  left: 0;
  top: 0;
  height: 2px;
  width: 100%;
  background: transparent;
  z-index: 20;
}
#progress-bar {
  height: 100%;
  width: 0;
  background: var(--ink);
  transition: width .4s var(--ease);
}

#counter {
  position: absolute;
  right: 56px;
  bottom: 28px;
  z-index: 20;
  font: 500 13px var(--font-mono);
  letter-spacing: .08em;
  color: var(--ink-2);
  display: flex;
  gap: 10px;
  align-items: center;
}
#counter-label { min-width: 62px; text-align: center; }
#counter button {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  background: transparent;
  font-size: 17px;
  line-height: 1;
  color: var(--ink-2);
  transition: background .2s, color .2s, border-color .2s;
}
#counter button:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }

#brand {
  position: absolute;
  left: var(--pad-x);
  bottom: 34px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  font: 500 11px var(--font-mono);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-3);
}
#brand::before {
  content: "";
  width: 18px;
  height: 2px;
  background: linear-gradient(90deg, var(--blue) 25%, var(--red) 25% 50%, var(--yellow) 50% 75%, var(--green) 75%);
  flex: none;
}

#help {
  position: absolute;
  left: 50%;
  bottom: 36px;
  transform: translateX(-50%);
  z-index: 20;
  font: 500 11px var(--font-mono);
  letter-spacing: .08em;
  color: var(--ink-3);
  opacity: 0;
  transition: opacity .3s;
}
#help.show { opacity: 1; }

/* --------------------------------------------------------------- overlays */

.overlay {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: none;
}
.overlay.is-open { display: block; }

#overview {
  background: rgba(244, 240, 231, .98);
  padding: 64px var(--pad-x);
  overflow: auto;
}
#overview .grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  column-gap: 64px;
}
#overview button {
  text-align: left;
  padding: 18px 0;
  border-top: 1px solid var(--line);
  background: transparent;
  display: flex;
  align-items: baseline;
  gap: 18px;
  min-height: 0;
}
#overview button .n {
  font: 500 11px var(--font-mono);
  letter-spacing: .12em;
  color: var(--ink-3);
  flex: none;
}
#overview button .t {
  font: 500 21px/1.25 var(--font-display);
  letter-spacing: -.01em;
}
#overview button:hover .t { color: var(--blue); }
#overview button.is-current .n { color: var(--blue); }
#overview button.is-current .t { color: var(--blue); }

#notes {
  left: auto;
  width: 640px;
  background: var(--bg);
  border-left: 1px solid var(--line-strong);
  padding: 52px 48px;
  overflow: auto;
}
#notes h3 {
  font: 500 34px/1.1 var(--font-display);
  letter-spacing: -.02em;
  margin-bottom: 12px;
}
#notes h4 {
  font: 500 11px var(--font-mono);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 28px 0 8px;
}
#notes p, #notes li { font: 400 18px/1.5 var(--font-body); }
#notes li { list-style: disc; margin-left: 20px; }
#notes .time {
  font: 500 11px var(--font-mono);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
}
#notes .btn { float: right; }

</style>
  <style>
/* ============================================================ media frames */

.photo, .shot {
  border-radius: 0;
  overflow: hidden;
  background: var(--bg-2);
  border: 1px solid var(--line);
  position: relative;
  box-shadow: none;
}
.photo img { width: 100%; height: 100%; object-fit: cover; }
.shot img { width: 100%; height: 100%; object-fit: contain; }
.shot.light { background: #fff; }
.shot.yellow { background: var(--bg-2); }
.shot.dark { background: #0C0F18; }
.shot.black { background: #000; }
.cap {
  position: absolute;
  left: 0;
  bottom: 0;
  font: 500 10px/1 var(--font-mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  background: rgba(244, 240, 231, .93);
  color: var(--ink-2);
  padding: 7px 9px;
  border-radius: 0;
}
.shot.dark .cap { background: rgba(12, 15, 24, .92); color: rgba(244, 240, 231, .8); }
.caption {
  font: 500 10px/1.4 var(--font-mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-top: 10px;
}

/* ================================================================== atoms */

.tag {
  font: 500 11px/1.2 var(--font-mono);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.tag.b { color: var(--blue); }
.tag.r { color: var(--red); }
.tag.g { color: var(--green); }
.tag.y { color: #A67C00; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  background: transparent;
  border: 1px solid var(--line);
  font: 500 14px/1 var(--font-body);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.dot.b { background: var(--blue); }
.dot.r { background: var(--red); }
.dot.y { background: var(--yellow); }
.dot.g { background: var(--green); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.ctrl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.btn {
  padding: 9px 16px;
  border-radius: var(--radius-pill);
  background: transparent;
  border: 1px solid var(--ink);
  color: var(--ink);
  font: 500 14px/1 var(--font-body);
  transition: background .2s, color .2s, border-color .2s;
}
.btn:hover { background: var(--ink); color: var(--bg); }
.btn.ghost { border-color: var(--line-strong); color: var(--ink-2); }
.btn.ghost:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.sel, .btn[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
}

.link {
  text-decoration: none;
  border-bottom: 1px solid var(--line-strong);
  padding-bottom: 2px;
  font: 500 15px/1.4 var(--font-body);
  color: var(--ink-2);
  transition: color .2s, border-color .2s;
}
.link::after { content: " ↗"; font-size: .85em; color: var(--ink-3); }
.link:hover { color: var(--ink); border-color: var(--ink); }

/* ================================================================== rules */

.rule { display: flex; align-items: center; gap: 5px; }
.rule i { width: 34px; height: 3px; display: block; flex: none; }
.rule span {
  margin-left: 14px;
  font: 500 11px/1.3 var(--font-mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* =================================================================== rows */

.rows { display: flex; flex-direction: column; }
.rows > li {
  display: grid;
  grid-template-columns: 48px 1fr;
  gap: 16px;
  padding: 16px 0;
  border-top: 1px solid var(--line);
  align-items: baseline;
}
.rows > li:last-child { border-bottom: 1px solid var(--line); }
.rows .idx {
  font: 500 11px/1.4 var(--font-mono);
  letter-spacing: .12em;
  color: var(--ink-3);
}
.rows h3 { font: 500 24px/1.15 var(--font-display); letter-spacing: -.015em; }
.rows p { font: 400 17px/1.45 var(--font-body); color: var(--ink-2); margin-top: 4px; }
.rows .link { font-size: 13px; margin-top: 6px; display: inline-block; }

/* =================================================================== flow */

.flow {
  display: flex;
  align-items: stretch;
  flex: none;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.flow .step {
  flex: 1;
  background: none;
  border-radius: 0;
  padding: 16px 24px 14px 0;
  box-shadow: none;
  font: 500 19px/1.15 var(--font-display);
  letter-spacing: .005em;
  display: flex;
  flex-direction: column;
  gap: 5px;
  position: relative;
}
.flow .step small {
  font: 400 13px/1.3 var(--font-body);
  color: var(--ink-2);
}
.flow .step i {
  font: 500 10px/1 var(--font-mono);
  letter-spacing: .14em;
  color: var(--ink-3);
  font-style: normal;
  margin-bottom: 3px;
}
.flow .arrow {
  width: 34px;
  display: grid;
  place-items: center;
  color: var(--ink-3);
  font-size: 15px;
  flex: none;
}
.flow .step.hot { outline: none; color: var(--blue); }
.flow .step.hot::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -1px;
  width: calc(100% - 34px);
  height: 2px;
  background: var(--blue);
}

/* =================================================================== code */

pre.code {
  background: var(--ink);
  color: var(--bg);
  border-radius: 0;
  padding: 26px 30px;
  font: 400 18px/1.55 var(--font-mono);
  white-space: pre-wrap;
  margin: 0;
}
pre.code .k { color: #8AB4F8; }
pre.code .s { color: #FDE293; }
pre.code .c { color: #9AA0A6; }
.panel-dark { background: var(--ink); color: var(--bg); }
.panel-dark .tag { color: #8AB4F8; }
.panel-dark pre.code { background: transparent; padding: 0; color: var(--bg); }
.panel-dark .fine { color: rgba(244, 240, 231, .55); }

/* ================================================================ MVP board */

.mvp { display: grid; grid-template-rows: auto 1fr; gap: 26px; flex: 1; min-height: 0; }
.mvp-pool {
  display: flex;
  flex-wrap: wrap;
  gap: 9px 10px;
  align-content: flex-start;
  padding: 0 0 20px;
  border-bottom: 1px solid var(--line-strong);
}
.mvp-pool .tag { width: 100%; margin-bottom: 4px; }

.mvp-buckets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; min-height: 0; }
.bucket {
  padding: 0 24px;
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
  transition: background .2s;
}
.bucket:first-child { border-left: 0; padding-left: 0; }
.bucket:last-child { padding-right: 0; }
.bucket.over { background: rgba(66, 133, 244, .045); }
.bucket header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font: 500 18px/1.2 var(--font-display);
  padding-bottom: 13px;
  border-bottom: 1px solid var(--line-strong);
}
.bucket .bucket-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 8px;
  vertical-align: 2px;
}
.bucket .count {
  font: 500 11px/1 var(--font-mono);
  color: var(--ink-3);
  min-width: 0;
  padding: 0;
  background: none;
}
.bucket .items { display: flex; flex-direction: column; min-height: 0; overflow: auto; }
.bucket .feat {
  width: 100%;
  border-radius: 0;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  padding: 11px 0;
  font: 400 15px/1.3 var(--font-body);
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  box-shadow: none;
}
.bucket .feat select { width: auto; max-width: 74px; margin-left: auto; font-size: 11px; }
.bucket .empty { font: 400 14px/1.4 var(--font-body); color: var(--ink-3); padding: 10px 0; }

.feat {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 7px 8px 7px 13px;
  border-radius: var(--radius-pill);
  background: transparent;
  border: 1px solid var(--line-strong);
  box-shadow: none;
  font: 500 14px/1.2 var(--font-body);
  cursor: grab;
}
.feat:focus-visible { border-color: var(--blue); }
.feat.dragging { opacity: .35; }
.feat select {
  font: 500 11px var(--font-body);
  border-radius: var(--radius-pill);
  border: 1px solid var(--line);
  background: var(--bg);
  padding: 3px 5px;
  cursor: pointer;
  color: var(--ink-2);
}

/* ============================================================ stack selector */

#selector .selector-scrim {
  position: absolute;
  inset: 0;
  background: rgba(27, 26, 22, .3);
}
#selector .selector-panel {
  position: absolute;
  left: 140px;
  right: 140px;
  top: 78px;
  bottom: 78px;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  padding: 42px 52px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.selector-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 32px; }
.selector-head > div { display: flex; flex-direction: column; gap: 8px; }
.sel-wrap { display: grid; grid-template-columns: 520px 1fr; gap: 64px; flex: 1; min-height: 0; }
.sel-questions { display: flex; flex-direction: column; gap: 0; }
.q {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 0;
  border-top: 1px solid var(--line);
}
.q .small { font: 500 15px/1.3 var(--font-body); color: var(--ink); }
.q .row { display: flex; gap: 8px; }
.q .row .btn { flex: 1; padding: 8px; font-size: 13px; }

.rec {
  border-left: 1px solid var(--line);
  padding: 0 0 0 40px;
  background: transparent;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-height: 0;
}
.rec .rec-summary {
  font: 500 34px/1.15 var(--font-display);
  letter-spacing: -.025em;
  color: var(--ink);
}
.rec ul { display: flex; flex-direction: column; }
.rec li {
  font: 400 18px/1.45 var(--font-body);
  color: var(--ink-2);
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.rec li b { color: var(--ink); font-family: var(--font-display); font-weight: 500; }

/* ========================================================== CLEAR framework */

.clear { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; min-height: 0; }
.letter {
  padding: 0 24px;
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 11px;
  opacity: .28;
  position: relative;
  transition: opacity .4s var(--ease), transform .4s var(--ease);
}
.letter:first-child { border-left: 0; padding-left: 0; }
.letter:last-child { padding-right: 0; }
.letter::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 24px;
  height: 2px;
  background: var(--c, var(--ink));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .4s var(--ease);
}
.letter:last-child::before { right: 0; }
.letter.on { opacity: 1; }
.letter.on::before { transform: scaleX(1); }
.letter .big {
  font: 400 104px/.9 var(--font-display);
  letter-spacing: -.05em;
  color: var(--ink);
  margin-top: 16px;
}
.letter h3 { font: 500 23px/1.15 var(--font-display); letter-spacing: -.015em; }
.letter p { font: 400 16px/1.4 var(--font-body); color: var(--ink-2); }
.letter .why { font-size: 14px; color: var(--ink-3); }
.letter .ex {
  margin-top: auto;
  font: 400 13px/1.45 var(--font-mono);
  color: var(--ink-2);
  background: none;
  border-top: 1px solid var(--line);
  border-radius: 0;
  padding: 11px 0 0;
}

.clear-prompt {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 32px;

  <style media="print">
/* Print / PDF export.
   Every slide becomes its own 1920x1080 page so the exported PDF matches the
   on-screen composition exactly. Used by tools/export-pdf.mjs. */

@page {
  size: 1920px 1080px;
  margin: 0;
}

@media print {
  html, body {
    height: auto;
    overflow: visible;
    background: #fff;
  }

  #viewport {
    position: static;
    display: block;
    background: #fff;
  }

  #stage {
    position: static;
    width: 1920px;
    height: auto;
    transform: none !important;
    margin: 0 !important;
    box-shadow: none !important;
    overflow: visible !important;
  }

  .slide {
    position: relative !important;
    inset: auto !important;
    width: 1920px;
    height: 1080px;
    opacity: 1 !important;
    visibility: visible !important;
    transform: none !important;
    transition: none !important;
    animation: none !important;
    break-after: page;
    page-break-after: always;
    overflow: hidden;
  }

  .slide:last-of-type {
    break-after: auto;
    page-break-after: auto;
  }

  /* chrome that belongs to the live app, not to the slides */
  #progress,
  #counter,
  #brand,
  #help,
  .overlay {
    display: none !important;
  }

  /* Blurred shadows rasterise as hard rectangles in PDF; flat panels print cleaner. */
  .card,
  .photo,
  .shot,
  .chip,
  .feat,
  .bucket,
  .letter,
  .rec,
  .mock,
  .clear-prompt,
  #notes button,
  #counter button {
    box-shadow: none !important;
  }

  /* keep the entry animations from freezing content at opacity 0 */
  .slide.is-active [data-rise],
  .slide [data-rise] {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }

  /* Chromium's PDF rasteriser renders background-clip:text gradients as a
     clipped rectangle. Fall back to a solid brand colour in the PDF only. */
  .grad-text {
    background: none !important;
    color: var(--blue) !important;
    -webkit-text-fill-color: var(--blue) !important;
    padding-bottom: 0 !important;
  }
}

</style>

  function createNavigation({ slideEls: slideEls2, onChange, stepHandlers: stepHandlers2 = {}, overlays: overlays2 }) {
    let current = 0;
    const total = slideEls2.length;
    const bar = document.getElementById("progress-bar");
    const label = document.getElementById("counter-label");
    const help = document.getElementById("help");
    function show(i, { silent = false } = {}) {
      i = Math.max(0, Math.min(total - 1, i));
      slideEls2.forEach((el, idx) => {
        el.classList.toggle("is-active", idx === i);
        el.classList.toggle("is-past", idx < i);
        el.setAttribute("aria-hidden", String(idx !== i));
        el.inert = idx !== i;
      });
      current = i;
      bar.style.width = `${(i + 1) / total * 100}%`;
      label.textContent = `${i + 1} / ${total}`;
      if (location.hash !== `#/${i + 1}`) history.replaceState(null, "", `#/${i + 1}`);
      if (!silent) onChange?.(i);
    }
    const id = () => current + 1;
    function next() {
      if (stepHandlers2[id()]?.forward?.()) return;
      show(current + 1);
    }
    function prev() {
      if (stepHandlers2[id()]?.back?.()) return;
      show(current - 1);
    }
    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen?.().catch(() => {
      });
    }
    document.addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = e.target.tagName;
      const interactive = tag === "BUTTON" || tag === "A" || tag === "SELECT" || tag === "INPUT";
      const k = e.key;
      if (k === "Escape") {
        overlays2.closeAll();
        help.classList.remove("show");
        return;
      }
      if (overlays2.anyOpen() && !["n", "N", "o", "O", "s", "S"].includes(k)) return;
      if (tag === "SELECT" && k.startsWith("Arrow")) return;
      switch (k) {
        case "ArrowRight":
          e.preventDefault();
          next();
          break;
        case "ArrowLeft":
          e.preventDefault();
          prev();
          break;
        case " ":
          if (interactive) return;
          e.preventDefault();
          next();
          break;
        case "Home":
          e.preventDefault();
          show(0);
          break;
        case "End":
          e.preventDefault();
          show(total - 1);
          break;
        case "f":
        case "F":
          toggleFullscreen();
          break;
        case "n":
        case "N":
          overlays2.toggle("notes");
          break;
        case "o":
        case "O":
          overlays2.toggle("overview");
          break;
        case "s":
        case "S":
          overlays2.toggle("selector");
          break;
        case "r":
        case "R":
          stepHandlers2[id()]?.forward?.();
          break;
        case "?":
        case "/":
          help.classList.toggle("show");
          break;
        default:
          return;
      }
    });
    document.getElementById("btn-prev").addEventListener("click", prev);
    document.getElementById("btn-next").addEventListener("click", next);
    document.getElementById("btn-overview").addEventListener("click", () => overlays2.toggle("overview"));
    const start = parseInt((location.hash.match(/#\/(\d+)/) || [])[1] || "1", 10) - 1;
    show(Number.isFinite(start) ? start : 0);
    window.addEventListener("hashchange", () => {
      const n = parseInt((location.hash.match(/#\/(\d+)/) || [])[1] || "1", 10) - 1;
      if (n !== current) show(n);
    });
    return { show, next, prev, get current() {
      return current;
    } };
  }

    let lastFocus = null;
    const isOpen = (n) => els[n].classList.contains("is-open");

    function closeAll() {
      Object.values(els).forEach((el) => {
        el.classList.remove("is-open");
        el.setAttribute("aria-hidden", "true");
      });
      lastFocus?.focus?.();
      lastFocus = null;
    }
    function open(name) {
      if (!anyOpen()) lastFocus = document.activeElement;
      Object.entries(els).forEach(([n, el]) => {

        el.setAttribute("aria-hidden", String(!on));
      });
      if (name === "notes") renderNotes(getCurrent());
      if (name === "overview") renderOverview(getCurrent());
      const focusable = els[name].querySelector("button, select, [tabindex]");
      focusable?.focus();
    }
    function toggle(name) {

      const o = e.target.closest("[data-open]");

      if (e.key !== "Tab") return;

      if (!panel) return;
      const items = [...panel.querySelectorAll("button, a[href], select, input, [tabindex]:not([tabindex='-1'])")].filter((el) => el.getClientRects().length > 0);

        e.preventDefault();
        first.focus();
      }
    });
    return { toggle, open, closeAll, anyOpen, refresh: (i) => {
      if (isOpen("notes")) renderNotes(i);

      if (!b || !dragId) return;
      e.preventDefault();
      state[dragId] = b.dataset.bucket;
      render();
    });
    root.addEventListener("change", (e) => {
      const s = e.target.closest("[data-move]");
      if (!s) return;
      state[s.dataset.move] = s.value;
      render();
      root.querySelector(`[data-id="${s.dataset.move}"] select`)?.focus();
    });
    const slide = root.closest(".slide");
    slide.addEventListener("click", (e) => {
      const a = e.target.closest("[data-mvp]")?.dataset.mvp;
      if (a === "suggest") FEATURES.forEach((f) => state[f.id] = f.suggest);
      else if (a === "reset") FEATURES.forEach((f) => state[f.id] = "pool");
      else return;
      render();
    });
    render();
  }

  // js/interactions/clear.js
  var CLEAR = [
    { k: "C", t: "Context", d: "Who is it for and what exists already?", w: "Without context, the model guesses at your product.", ex: "Flutter app for barangay flood reports." },
    { k: "L", t: "Limitations", d: "Time, budget, stack, devices.", w: "Limits are what stop the output from overengineering.", ex: "3-day sprint. Firebase. Low-end Android." },
    { k: "E", t: "Expected outcome", d: "A result you can check.", w: "A checkable outcome is what you can write a test against.", ex: "Located report sent in under 30 seconds." },
    { k: "A", t: "Architecture", d: "How the pieces connect.", w: "A diagram beats a paragraph when you mean 'these two'.", ex: "Flutter UI \u2192 Firestore \u2192 Gemini triage." },
    { k: "R", t: "Requirements", d: "Tests and quality bars.", w: "Requirements survive the next person who touches the code.", ex: "Validation unit tests + one end-to-end flow." }
  ];
  var COLORS = ["var(--blue)", "var(--red)", "var(--yellow)", "var(--green)", "var(--blue)"];
  var PROMPT = [
    "<span class='k'>Context:</span> Flutter app for barangay flood reports.",
    "<span class='k'>Limitations:</span> 3-day sprint. Firebase. Low-end Android.",
    "<span class='k'>Expected outcome:</span> Located report sent in under 30 seconds.",
    "<span class='k'>Architecture:</span> Flutter UI \u2192 Firestore \u2192 Gemini triage.",
    "<span class='k'>Requirements:</span> Validation unit tests + one end-to-end flow."
  ];
  function initClear(root) {
    if (!root) return { forward: () => false, back: () => false };
    let shown = 0;
    const out = document.getElementById("clear-text");
    root.innerHTML = CLEAR.map((c, i) => `
    <div class="letter" data-i="${i}" style="--c:${COLORS[i]}">
      <div class="big">${c.k}</div>
      <h3>${c.t}</h3><p>${c.d}</p><p class="why">${c.w}</p><div class="ex">${c.ex}</div>
    </div>`).join("");
    const cards = [...root.querySelectorAll(".letter")];
    const paint = () => {
      cards.forEach((el, i) => el.classList.toggle("on", i < shown));
      if (out) {
        out.innerHTML = shown ? PROMPT.slice(0, shown).join("\n") : '<span class="placeholder">Reveal a letter to start building the prompt.</span>';
      }
    };
    const api = {
      forward() {
        if (shown >= CLEAR.length) return false;
        shown++;
        paint();
        return true;
      },
      back() {
        if (shown <= 0) return false;
        shown--;
        paint();
        return true;
      },
      all() {
        shown = CLEAR.length;
        paint();
      },
      reset() {
        shown = 0;
        paint();
      }
    };
    root.closest(".slide").addEventListener("click", (e) => {
      const a = e.target.closest("[data-clear]")?.dataset.clear;
      if (a === "next") api.forward();
      else if (a === "all") api.all();
      else if (a === "reset") api.reset();
    });
    paint();
    return api;
  }

  // js/interactions/selector.js
  var QUESTIONS = [
    { key: "platform", q: "Platform", opts: [["web", "Web"], ["mobile", "Mobile"]] },
    { key: "runtime", q: "Where does AI run?", opts: [["cloud", "Cloud"], ["offline", "Offline"]] },
    { key: "ai", q: "Type of AI", opts: [["genai", "Generative AI"], ["ml", "Traditional ML"]] },
    { key: "backend", q: "Backend", opts: [["simple", "Simple"], ["advanced", "Advanced"]] }
  ];
  function recommend(a) {
    const items = [];
    let summary;
    if (a.platform === "mobile") {
      items.push(["Flutter", "One codebase for Android and iOS, with fast iteration."]);
    } else {
      items.push(["Flutter (web) or a standard web stack", "Flutter can target the web; a plain HTML/JS front end is fine for simple pages."]);
    }
    if (a.backend === "simple") {
      items.push(["Firebase", "Authentication, Firestore, and hosting without running servers."]);
    } else {
      items.push(["Google Cloud with Cloud Run", "Custom services, containers, and scaling control. Keep Firebase for auth if useful."]);
    }
    if (a.ai === "genai" && a.runtime === "cloud") {
      const tool = a.backend === "simple" ? "Gemini via Firebase AI Logic" : "Gemini API (or Vertex AI)";
      items.push([tool, "Hosted generative models with structured output and function calling."]);
      summary = "Flutter + Firebase + Gemini";
    } else if (a.ai === "genai") {
      items.push(["Google AI Edge", "Run generative models on the device. Needs capable hardware; you can try models in AI Edge Gallery."]);
      summary = "Flutter + Firebase + Google AI Edge";
    } else if (a.runtime === "cloud") {
      items.push([
        a.backend === "simple" ? "Vertex AI (when you need a custom model)" : "Vertex AI with BigQuery",
        "Train and serve custom models; BigQuery for analysis of larger data."
      ]);
      summary = "Flutter + Firebase + Vertex AI";
    } else {
      items.push(["ML Kit, then LiteRT", "ML Kit for ready-made vision and text APIs; LiteRT to run your own model on the device."]);
      summary = "Flutter + Firebase + ML Kit / LiteRT";
    }
    let note = "A starting point, not a rule. Validate it against your problem statement.";
    if (a.platform === "web" && a.runtime === "offline") {
      summary = "Web front end + Firebase + ML Kit / LiteRT";
      note = "Offline on-device AI is strongest on mobile. For web, consider a hybrid with a cloud fallback.";
    }
    return { items, note, summary };
  }
  function initSelector(root) {
    const answers = { platform: "mobile", runtime: "cloud", ai: "genai", backend: "simple" };
    function render() {
      const rec = recommend(answers);
      root.innerHTML = `
      <div class="selector-scrim" data-close></div>
      <div class="selector-panel" role="dialog" aria-modal="true" aria-label="Stack selector">
        <div class="selector-head">
          <div><span class="label">Interactive</span><h2 class="h-md">Stack selector</h2></div>
          <button class="btn ghost" data-close>Close (Esc)</button>
        </div>
        <div class="sel-wrap">
          <div class="sel-questions">
            ${QUESTIONS.map((q) => `<div class="q"><span class="small">${q.q}</span><div class="row">${q.opts.map(([v, l]) => `<button class="btn ghost" data-k="${q.key}" data-v="${v}" aria-pressed="${answers[q.key] === v}">${l}</button>`).join("")}</div></div>`).join("")}
          </div>
          <div class="rec" aria-live="polite"><span class="tag b">Recommended stack</span>
            <p class="rec-summary">${rec.summary}</p>
            <ul>${rec.items.map(([n, d]) => `<li><b>${n}</b><br>${d}</li>`).join("")}</ul>
            <p class="small">${rec.note}</p></div>
        </div>
      </div>`;
    }
    root.addEventListener("click", (e) => {
      const b = e.target.closest("[data-k]");
      if (!b) return;
      answers[b.dataset.k] = b.dataset.v;
      render();
      root.querySelector(`[data-k="${b.dataset.k}"][data-v="${b.dataset.v}"]`)?.focus();
    });
    render();
  }

  // js/interactions.js
  function initInteractions() {
    initMvp(document.getElementById("mvp-root"));
    initSelector(document.getElementById("selector"));
    const clear = initClear(document.getElementById("clear-root"));
    return { 12: { forward: () => clear.forward(), back: () => clear.back() } };
  }

  // js/diagrams.js
  var NS = "http://www.w3.org/2000/svg";
  var SPARK = "M12 0C13 7 17 11 24 12C17 13 13 17 12 24C11 17 7 13 0 12C7 11 11 7 12 0Z";
  var defs = `<defs>
  <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4285F4"/><stop offset=".5" stop-color="#7C86D9"/><stop offset="1" stop-color="#D97C86"/>
  </linearGradient>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4285F4"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#34A853"/>
  </marker>
</defs>`;
  var sparkle = (x, y, s = 2) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="${SPARK}" fill="url(#gem)"/></g>`;
  var MARKS = {
    flutter: { src: "assets/images/flutter_logo.png", iw: 953, ih: 272, crop: [4, 4, 214, 264] },
    firebase: { src: "assets/images/firebase_logo.png", iw: 640, ih: 640, crop: [211, 117, 219, 273] },
    mlkit: { src: "assets/images/google_ml_kit.png", iw: 1600, ih: 468, crop: [0, 54, 496, 360] },
    gcloud: { src: "assets/images/Google_cloud.png", iw: 225, ih: 225, crop: [52, 41, 121, 98] }
  };
  function mark(x, y, h, key) {
    const m = MARKS[key];
    const [cx, cy, cw, ch] = m.crop;
    const w = Math.round(h * (cw / ch));
    return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${cx} ${cy} ${cw} ${ch}" preserveAspectRatio="xMidYMid meet"><image href="${m.src}" x="0" y="0" width="${m.iw}" height="${m.ih}"/></svg>`;
  }
  function svg(viewBox, inner, label) {
    const s = document.createElementNS(NS, "svg");
    s.setAttribute("viewBox", viewBox);
    s.setAttribute("class", "diagram");
    s.setAttribute("role", "img");
    s.setAttribute("aria-label", label);
    s.setAttribute("preserveAspectRatio", "xMidYMid meet");
    s.innerHTML = defs + inner;
    return s;
  }
  var TREE = [
    { need: "Mobile", tool: "Flutter", mark: "flutter", when: "One codebase for Android and iOS, with fast UI iteration." },
    { need: "Backend", tool: "Firebase", mark: "firebase", when: "Managed Auth, Firestore, and Hosting without running servers." },
    { need: "Generative AI", tool: "Gemini", mark: "gemini", when: "Text, image, and structured output via the API or Firebase AI Logic." },
    { need: "Computer Vision", tool: "ML Kit", mark: "mlkit", when: "Ready-made on-device APIs for text, barcode, and face detection." },
    { need: "Offline AI", tool: "Google AI Edge", mark: "edge", when: "Run models on the device with LiteRT, no connection needed." },
    { need: "Custom Infrastructure", tool: "Google Cloud", mark: "gcloud", when: "Cloud Run, Vertex AI, and BigQuery for custom services at scale." }
  ];
  var TREE_W = 1680;
  var ROW_H = 92;
  var ROW_GAP = 14;
  var ROOT_W = 340;
  var ROW_X = 420;
  var MARK_X = 700;
  var MARK_H = 38;
  var TEXT_X = 786;
  function buildTree(root) {
    const H = TREE.length * ROW_H + (TREE.length - 1) * ROW_GAP;
    const rootH = 116;
    const rootY = (H - rootH) / 2;
    const rootCY = rootY + rootH / 2;
    let inner = "";
    TREE.forEach((t, i) => {
      const cy = i * (ROW_H + ROW_GAP) + ROW_H / 2;
      inner += `<path class="edge" d="M ${ROOT_W} ${rootCY} C ${ROOT_W + 70} ${rootCY}, ${ROW_X - 70} ${cy}, ${ROW_X} ${cy}"/>`;
    });
    inner += `<g class="node root">
    <line class="root-rule" x1="0" y1="${rootCY - 68}" x2="0" y2="${rootCY + 58}"/>
    <text x="26" y="${rootCY - 10}">What does your</text>
    <text x="26" y="${rootCY + 30}">problem need?</text>
  </g>`;
    TREE.forEach((t, i) => {
      const y = i * (ROW_H + ROW_GAP);
      const markTop = y + (ROW_H - MARK_H) / 2;
      let icon = "";
      if (t.mark === "gemini") icon = sparkle(MARK_X + 2, markTop, MARK_H / 24);
      else if (t.mark === "edge") icon = `<circle cx="${MARK_X + MARK_H / 2}" cy="${markTop + MARK_H / 2}" r="11" fill="#34A853"/>`;
      else icon = mark(MARK_X, markTop, MARK_H, t.mark);
      inner += `<g class="node row" tabindex="0" data-tree="${i}">
      <title>${t.need} leads to ${t.tool}. ${t.when}</title>
      <rect x="${ROW_X}" y="${y}" width="${TREE_W - ROW_X}" height="${ROW_H}" rx="0"/>
      <text class="need" x="${ROW_X}" y="${y + 44}">${t.need}</text>
      <text class="arrow" x="670" y="${y + 44}">\u2192</text>
      ${icon}
      <text class="tool" x="${TEXT_X}" y="${y + 39}">${t.tool}</text>
      <text class="sub" x="${TEXT_X}" y="${y + 64}">${t.when}</text>
      <line class="row-line" x1="${ROW_X}" y1="${y + ROW_H}" x2="${TREE_W}" y2="${y + ROW_H}"/>
    </g>`;
    });
    const s = svg(
      `0 0 ${TREE_W} ${H}`,
      inner,
      "Decision tree: Mobile leads to Flutter, Backend to Firebase, Generative AI to Gemini, Computer Vision to ML Kit, Offline AI to Google AI Edge, and Custom Infrastructure to Google Cloud."
    );
    s.addEventListener("pointerover", (e) => highlight(s, e.target.closest("[data-tree]")));
    s.addEventListener("focusin", (e) => highlight(s, e.target.closest("[data-tree]")));
    s.addEventListener("pointerleave", () => highlight(s, null));
    root.replaceChildren(s);
  }
  function highlight(s, node) {
    s.querySelectorAll("[data-tree]").forEach((n) => n.classList.toggle("hot", n === node));
  }
  function buildArch(root) {
    const box = (x, y, w, h, title, subs, id, markSvg = "") => `
    <g class="node arch" data-n="${id}">
      <title>${title}</title>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="20"/>
      ${markSvg}
      <text x="${x + (markSvg ? 78 : 22)}" y="${y + 44}">${title}</text>
      ${subs.map((t, i) => `<text class="sub" x="${x + 22}" y="${y + 78 + i * 26}">${t}</text>`).join("")}
    </g>`;
    const inner = `
    <rect class="zone green" x="0" y="0" width="290" height="540" rx="26"/>
    <text class="zone-label green" x="22" y="36">ON DEVICE</text>
    <rect class="zone blue" x="320" y="0" width="580" height="540" rx="26"/>
    <text class="zone-label blue" x="342" y="36">CLOUD</text>

    <path class="edge flow green" d="M 145 396 L 145 168" marker-end="url(#arrow-green)"/>
    <path class="edge flow blue" d="M 274 424 C 314 424, 314 148, 340 148" marker-end="url(#arrow-blue)"/>
    <path class="edge flow blue" d="M 274 470 L 340 470" marker-end="url(#arrow-blue)"/>
    <path class="edge flow blue" d="M 620 148 L 630 148" marker-end="url(#arrow-blue)"/>
    <path class="edge flow blue" d="M 620 448 L 630 448" marker-end="url(#arrow-blue)"/>

    ${box(16, 64, 258, 104, "ML Kit", ["On-device APIs"], "mlkit", mark(36, 82, 30, "mlkit"))}
    ${box(16, 396, 258, 104, "Flutter app", ["UI and app logic"], "flutter", mark(36, 414, 30, "flutter"))}
    ${box(340, 96, 280, 104, "Firebase", ["Auth \xB7 Firestore"], "fb")}
    ${box(340, 396, 280, 104, "Firebase AI Logic", ["Client SDK for Gemini"], "ail")}
    ${box(630, 88, 256, 120, "Google Cloud", ["Cloud Run \xB7 Vertex AI", "BigQuery"], "gc")}
    ${box(630, 396, 256, 104, "Gemini", ["Cloud inference"], "gem", sparkle(648, 414, 1.25))}
  `;
    const s = svg(
      "0 0 900 540",
      inner,
      "Architecture: the Flutter app uses ML Kit on the device, Firebase for data and authentication, Firebase AI Logic to reach Gemini in the cloud, and Google Cloud services behind Firebase."
    );
    root.replaceChildren(s);
  }
  function initDiagrams() {
    const t = document.getElementById("tree-root");
    const a = document.getElementById("arch-root");
    if (t) buildTree(t);
    if (a) buildArch(a);
  }

  // js/animations.js
  var reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function fitStage(stage2) {
    const fit = () => {
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stage2.style.transform = `scale(${s})`;
      stage2.style.margin = `${-(1080 * (1 - s)) / 2}px ${-(1920 * (1 - s)) / 2}px`;
    };
    fit();
    window.addEventListener("resize", fit);
    document.addEventListener("fullscreenchange", () => setTimeout(fit, 50));
  }
  function createFlowAnimator() {
    let timer = null;
    const steps = () => [...document.querySelectorAll("#ai-flow .step")];
    const stop = () => {
      clearInterval(timer);
      timer = null;
      steps().forEach((s) => s.classList.remove("hot"));
    };
    return {
      onSlide(index) {
        stop();
        if (index !== 8) return;
        const els = steps();
        if (reduced()) {
          els.forEach((s) => s.classList.add("hot"));
          return;
        }
        let i = 0;
        const tick = () => {
          els.forEach((s, n) => s.classList.toggle("hot", n === i));
          i = (i + 1) % els.length;
        };
        tick();
        timer = setInterval(tick, 1100);
      }
    };
  }

  // js/asset-manager.js
  var imageStatus = [];
  function manageImages(root) {
    root.querySelectorAll("img").forEach((img) => {
      img.decoding = "async";
      const slide = img.closest(".slide");
      const record = (ok) => imageStatus.push({ src: img.getAttribute("src"), slide: slide ? Number(slide.id.replace("slide-", "")) : null, ok, w: img.naturalWidth, h: img.naturalHeight });
      const fail = () => {
        record(false);
        console.error(`Image failed to load: ${img.getAttribute("src")}`);
        img.alt = `${img.alt} (image unavailable)`;
        img.style.visibility = "hidden";
      };
      img.addEventListener("error", fail, { once: true });
      if (img.complete) img.naturalWidth ? record(true) : fail();
      else img.addEventListener("load", () => record(true), { once: true });
    });
    window.__imageStatus = imageStatus;
  }

  // js/app.js
  var stage = document.getElementById("stage");
  var slideEls = renderSlides(stage);
  manageImages(stage);
  initDiagrams();
  var stepHandlers = initInteractions();
  fitStage(stage);
  var flow = createFlowAnimator();
  var nav;
  var overlays = createOverlays({ goTo: (i) => nav.show(i), getCurrent: () => nav.current });
  nav = createNavigation({
    slideEls,
    stepHandlers,
    overlays,
    onChange: (i) => {
      flow.onSlide(i);
      overlays.refresh(i);
    }
  });
  flow.onSlide(nav.current);
  document.title = `${slides[nav.current].title} \xB7 From Idea to MVP`;
  window.__deck = { nav, total: slides.length };
})();

</script>
</body>
